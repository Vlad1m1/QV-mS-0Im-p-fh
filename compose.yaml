name: personaljournal

services:
  app:
    build:
      context: .
    image: personaljournal:local
    ports:
      - "127.0.0.1:${PERSONALJOURNAL_PORT:-8000}:8000"
    environment:
      LAB_DB: /app/data/journal.sqlite3
      LAB_COOKIE_SECURE: "${LAB_COOKIE_SECURE:-0}"
    volumes:
      - journal_data:/app/data
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  journal_data:
